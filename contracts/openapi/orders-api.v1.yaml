openapi: 3.0.3
info:
  title: Orders API
  version: 1.1.0
  description: |
    Source of truth for the Orders HTTP API.
    Change process: docs/07-contracts.md. Every change needs an entry in contracts/CHANGELOG.md.
    Breaking changes need an ADR and a new major version file (orders-api.v2.yaml).
servers:
  - url: http://localhost:8080
paths:
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
  /api/v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Fetch an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel a placed order (ORD-002)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    OrderLine:
      type: object
      additionalProperties: false
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [customerId, lines]
      properties:
        customerId:
          type: string
          minLength: 1
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    CancelOrderRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Order:
      type: object
      additionalProperties: false
      required: [id, customerId, status, lines, total, createdAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
        status:
          type: string
          enum: [PLACED, SHIPPED, CANCELLED]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        cancellationReason:
          type: string
          description: Present only when status is CANCELLED. Added in 1.1.0.
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
